name: Supabase Keepalive

# Ping free-tier Supabase projects every 3 days to reduce idle auto-pause risk.
# Configure repo Secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_SUITE_URL / SUPABASE_SUITE_ANON_KEY   → Techlife-suite
#   SUPABASE_STOCK_URL / SUPABASE_STOCK_ANON_KEY   → Techlife-stock-quant

on:
  schedule:
    - cron: "17 2 */3 * *" # every 3 days ~02:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    if: github.repository == 'Laurenceku2026/techlife-portal'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ping Supabase projects
        env:
          SUPABASE_SUITE_URL: ${{ secrets.SUPABASE_SUITE_URL }}
          SUPABASE_SUITE_ANON_KEY: ${{ secrets.SUPABASE_SUITE_ANON_KEY }}
          SUPABASE_STOCK_URL: ${{ secrets.SUPABASE_STOCK_URL }}
          SUPABASE_STOCK_ANON_KEY: ${{ secrets.SUPABASE_STOCK_ANON_KEY }}
        run: python scripts/supabase_keepalive.py
